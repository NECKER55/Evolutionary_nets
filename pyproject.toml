[project]
name = "evonets"
version = "0.1.0"
description = "Vita artificiale e neuroevoluzione 2D con vincoli energetici"
requires-python = ">=3.11"
dependencies = [
    "numba>=0.68.0",
    "numpy>=2.0",
    "pygame-ce>=2.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
