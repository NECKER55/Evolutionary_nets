[project]
name = "evonets"
version = "0.1.0"
description = "Vita artificiale e neuroevoluzione 2D con vincoli energetici"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]>=0.10.2",
    "mujoco>=3.17.0",
    "numba>=0.68.0",
    "numpy>=2.0",
    "pygame-ce>=2.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]
# Le reti già pronte per la percezione: opzionali, `uv run --group percezione ...`.
percezione = [
    "pillow>=10",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.50",
    "ultralytics>=8.3",  # FastSAM
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }  # deve combaciare con torch

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
