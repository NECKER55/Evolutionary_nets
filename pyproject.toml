[project]
name = "evonets"
version = "0.1.0"
description = "Vita artificiale e neuroevoluzione 2D con vincoli energetici"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10.2",
    "mujoco>=3.17.0",
    "numba>=0.68.0",
    "numpy>=2.0",
    "pygame-ce>=2.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]
# Acceleratore: una sola scelta tra questi due gruppi, che non si installano insieme.
#   uv sync --group cuda   # macchina con NVIDIA: JAX e torch sulla GPU (scarica le librerie CUDA, circa 3 GB)
#   uv sync --group cpu    # portatile o macchina senza NVIDIA: tutto sulla CPU
# Il codice sceglie il dispositivo da solo (JAX e `torch.cuda.is_available()`).
cuda = ["jax[cuda12]>=0.10.2", "torch>=2.6", "torchvision>=0.21"]
cpu = ["torch>=2.6", "torchvision>=0.21"]
# Le reti già pronte per la percezione: opzionali, con uno dei due gruppi sopra.
percezione = [
    "pillow>=10",
    "transformers>=4.50",
    "ultralytics>=8.3",  # FastSAM
]

[tool.uv]
conflicts = [[{ group = "cuda" }, { group = "cpu" }]]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", group = "cuda", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cuda", group = "cuda", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
